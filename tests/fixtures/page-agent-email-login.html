<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>163 网易邮箱登录 Fixture</title>
		<style>
			body {
				margin: 0;
				min-height: 100vh;
				display: grid;
				place-items: center;
				background: linear-gradient(135deg, #8ec5ff, #f7fbff);
				font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
			}

			.login-card {
				width: min(420px, calc(100vw - 40px));
				background: #fff;
				border-radius: 12px;
				box-shadow: 0 24px 80px rgba(15, 23, 42, 0.18);
				padding: 28px;
			}

			h1 {
				margin: 0 0 24px;
				font-size: 26px;
				text-align: center;
			}

			label {
				display: block;
				font-size: 13px;
				color: #4b5563;
				margin-bottom: 8px;
			}

			input {
				box-sizing: border-box;
				width: 100%;
				height: 48px;
				margin-bottom: 16px;
				border: 1px solid #cbd5e1;
				border-radius: 8px;
				padding: 0 12px;
				font: inherit;
			}

			button {
				width: 100%;
				height: 48px;
				border: 0;
				border-radius: 8px;
				background: #2563eb;
				color: #fff;
				font: inherit;
				font-weight: 700;
			}

			.success {
				display: none;
				margin: 0;
				color: #166534;
				font-size: 18px;
				font-weight: 700;
				text-align: center;
			}

			body[data-logged-in="true"] form {
				display: none;
			}

			body[data-logged-in="true"] .success {
				display: block;
			}
		</style>
		<script>
			function completeLogin(event) {
				event.preventDefault()
				document.body.dataset.loggedIn = 'true'
			}
		</script>
	</head>
	<body>
		<form class="login-card" onsubmit="completeLogin(event)">
			<h1>账号登录</h1>
			<label for="mail-account">邮箱账号或手机号</label>
			<input id="mail-account" name="email" autocomplete="username" placeholder="邮箱账号或手机号" />
			<label for="mail-password">输入密码</label>
			<input
				id="mail-password"
				name="password"
				type="password"
				autocomplete="current-password"
				placeholder="输入密码"
			/>
			<button type="submit">登录</button>
		</form>
		<p class="login-card success">登录成功</p>
	</body>
</html>
